<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classroom Live</title><link rel="stylesheet" href="/style.css">
</head>
<body class="home-body">
  <main class="home-shell">
    <section class="hero-card">
      <div class="brand">CLASSROOM <span>LIVE</span></div>
      <p class="eyebrow">REAL-TIME ONLINE CLASSROOM</p>
      <h1>Meet, teach and learn<br><span>without the noise.</span></h1>
      <p class="hero-copy">Real camera, real microphone and WebRTC media with a stability-first classroom experience.</p>
      <div class="status-row"><span class="status-dot"></span><span id="browserStatus">Checking browser…</span></div>
    </section>
    <section class="join-card">
      <div class="tabs"><button class="tab active" data-mode="create">Create Meeting</button><button class="tab" data-mode="join">Join Meeting</button></div>
      <form id="meetingForm">
        <label>Your name<input id="name" maxlength="40" autocomplete="name" placeholder="e.g. Haikal" required></label>
        <label id="roomWrap" class="hidden">Room code<input id="room" maxlength="9" autocomplete="off" placeholder="CL-XXXXXX"></label>
        <button class="primary" type="submit" id="submitBtn">Create Meeting <span>→</span></button>
      </form>
      <p class="tiny">Camera and microphone permission will be requested only when you enter the meeting lobby.</p>
    </section>
  </main>
  <script>
    const form=document.getElementById('meetingForm'), roomWrap=document.getElementById('roomWrap'), room=document.getElementById('room'), name=document.getElementById('name'), submit=document.getElementById('submitBtn'), status=document.getElementById('browserStatus');
    let mode='create';
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));roomWrap.classList.toggle('hidden',mode==='create');submit.innerHTML=mode==='create'?'Create Meeting <span>→</span>':'Join Meeting <span>→</span>';room.required=mode==='join';});
    const supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.RTCPeerConnection);
    status.textContent=supported?'WebRTC ready • Camera & microphone supported':'Some WebRTC features are unavailable in this browser';
    form.onsubmit=e=>{e.preventDefault();const n=encodeURIComponent(name.value.trim());if(!n)return;if(mode==='create')location.href=`/meeting.html?new=1&name=${n}`;else location.href=`/meeting.html?room=${encodeURIComponent(room.value.trim().toUpperCase())}&name=${n}`;};
  </script>
</body></html>
