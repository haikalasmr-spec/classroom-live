<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CLASSROOM LIVE</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:white;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* HOME */

#home{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        radial-gradient(circle at 20% 20%,#263b91 0,transparent 35%),
        radial-gradient(circle at 80% 80%,#512b82 0,transparent 35%),
        #080c19;
}

.home-card{
    width:min(560px,100%);
    background:rgba(20,27,49,.94);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    padding:40px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    font-size:30px;
    font-weight:800;
    margin-bottom:10px;
}

.logo span{
    color:#72a7ff;
}

.hero{
    font-size:38px;
    line-height:1.1;
    margin:20px 0 12px;
}

.subtitle{
    color:#aeb8d4;
    line-height:1.6;
    margin-bottom:30px;
}

.input{
    width:100%;
    padding:15px 17px;
    border-radius:14px;
    border:1px solid #35405e;
    background:#11182d;
    color:white;
    outline:none;
    margin-bottom:14px;
}

.input:focus{
    border-color:#6b9cff;
}

.home-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.primary,
.secondary{
    padding:15px;
    border-radius:14px;
    font-weight:700;
}

.primary{
    background:#467cff;
    color:white;
}

.secondary{
    background:#202a46;
    color:white;
}

/* LOBBY */

#lobby{
    min-height:100vh;
    padding:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080c19;
}

.lobby-card{
    width:min(900px,100%);
    background:#12192c;
    border:1px solid #293451;
    border-radius:25px;
    padding:25px;
}

.lobby-title{
    font-size:26px;
    font-weight:800;
    margin-bottom:20px;
}

.preview{
    width:100%;
    aspect-ratio:16/9;
    background:#05070d;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

.preview video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:none!important;
}

.preview-label{
    position:absolute;
    left:15px;
    bottom:15px;
    background:rgba(0,0,0,.65);
    padding:8px 12px;
    border-radius:10px;
}

.lobby-controls{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.control{
    background:#202a46;
    color:white;
    padding:13px 18px;
    border-radius:12px;
}

.control.active{
    background:#467cff;
}

.join-btn{
    width:100%;
    margin-top:18px;
    padding:16px;
    border-radius:14px;
    background:#467cff;
    color:white;
    font-weight:800;
}

/* MEETING */

#meeting{
    min-height:100vh;
    background:#080c15;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:65px;
    flex-shrink:0;
    background:#111827;
    border-bottom:1px solid #273149;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    gap:12px;
}

.brand-small{
    font-weight:800;
    font-size:20px;
}

.room-code{
    color:#9da9c7;
    font-size:13px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.small-btn{
    background:#202a40;
    color:white;
    padding:9px 12px;
    border-radius:10px;
}

.content{
    flex:1;
    display:flex;
    min-height:0;
}

.grid{
    flex:1;
    padding:15px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    grid-auto-rows:minmax(180px,1fr);
    gap:12px;
    overflow:auto;
}

.tile{
    position:relative;
    background:#151c2e;
    border:1px solid #2b3650;
    border-radius:17px;
    overflow:hidden;
    min-height:180px;
}

.tile video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#05070c;
    transform:none!important;
}

.tile .avatar{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    background:#151c2e;
}

.tile .name{
    position:absolute;
    left:10px;
    bottom:10px;
    background:rgba(0,0,0,.68);
    padding:7px 10px;
    border-radius:9px;
    font-size:13px;
    z-index:5;
}

.tile .state{
    position:absolute;
    right:10px;
    bottom:10px;
    z-index:5;
    display:flex;
    gap:5px;
}

.badge{
    background:rgba(0,0,0,.7);
    border-radius:8px;
    padding:5px 7px;
    font-size:13px;
}

.hand{
    position:absolute;
    top:10px;
    right:10px;
    z-index:5;
    background:#f2c94c;
    color:#111;
    padding:6px 9px;
    border-radius:9px;
    font-weight:700;
}

.sidebar{
    width:310px;
    background:#111827;
    border-left:1px solid #273149;
    display:none;
    flex-direction:column;
}

.sidebar.open{
    display:flex;
}

.side-head{
    padding:18px;
    border-bottom:1px solid #273149;
    font-weight:800;
}

.people-list{
    overflow:auto;
    flex:1;
}

.person{
    padding:13px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.person-info{
    display:flex;
    gap:10px;
    align-items:center;
}

.person-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#33446e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.person-name{
    font-size:14px;
}

.person-role{
    color:#8793ae;
    font-size:11px;
}

/* CHAT */

.chat{
    position:fixed;
    right:20px;
    bottom:90px;
    width:min(360px,calc(100vw - 40px));
    height:460px;
    background:#111827;
    border:1px solid #303b56;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:none;
    flex-direction:column;
    z-index:100;
}

.chat.open{
    display:flex;
}

.chat-head{
    padding:15px;
    border-bottom:1px solid #303b56;
    font-weight:800;
}

.chat-messages{
    flex:1;
    overflow:auto;
    padding:12px;
}

.message{
    margin-bottom:12px;
}

.message-name{
    font-size:12px;
    color:#7fa9ff;
    margin-bottom:3px;
}

.message-text{
    background:#202a40;
    padding:8px 10px;
    border-radius:10px;
    word-break:break-word;
}

.chat-input{
    padding:10px;
    display:flex;
    gap:7px;
    border-top:1px solid #303b56;
}

.chat-input input{
    flex:1;
    background:#202a40;
    border:1px solid #34415e;
    color:white;
    border-radius:10px;
    padding:10px;
    outline:none;
}

.chat-input button{
    width:45px;
    border-radius:10px;
    background:#467cff;
    color:white;
}

/* CONTROLS */

.bottom{
    height:78px;
    flex-shrink:0;
    background:#111827;
    border-top:1px solid #273149;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:10px;
}

.meet-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#202a40;
    color:white;
    font-size:19px;
}

.meet-btn.active{
    background:#467cff;
}

.meet-btn.danger{
    background:#d94b55;
}

.sound-btn{
    background:#273a64;
    color:white;
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:300;
    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-card{
    width:min(430px,100%);
    background:#151d31;
    border:1px solid #34405d;
    border-radius:20px;
    padding:24px;
}

.modal-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal-buttons button{
    flex:1;
    padding:12px;
    border-radius:11px;
}

.background-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.bg-option{
    min-height:80px;
    border-radius:12px;
    background:#27324c;
    color:white;
    padding:10px;
}

.error{
    color:#ff7f88;
    margin-top:10px;
    font-size:13px;
}

.status{
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    background:#172039;
    border:1px solid #32415f;
    padding:10px 16px;
    border-radius:12px;
    z-index:250;
    display:none;
}

.status.show{
    display:block;
}

@media(max-width:750px){
    .home-card{
        padding:25px;
    }

    .hero{
        font-size:30px;
    }

    .home-buttons{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:fixed;
        right:0;
        top:65px;
        bottom:78px;
        z-index:90;
        width:min(320px,90vw);
    }

    .bottom{
        overflow-x:auto;
    }

    .sound-btn{
        display:none;
    }

    .grid{
        grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
        grid-auto-rows:150px;
    }

    .tile{
        min-height:150px;
    }
}
</style>
</head>

<body>

<section id="home">

    <div class="home-card">

        <div class="logo">
            CLASSROOM <span>LIVE</span>
        </div>

        <div class="hero">
            Belajar bersama,<br>
            langsung terhubung.
        </div>

        <div class="subtitle">
            Video meeting sederhana untuk guru dan siswa.
            Kamera, microphone, chat, peserta dan background
            tersedia dalam satu meeting.
        </div>

        <input
            id="homeName"
            class="input"
            maxlength="40"
            placeholder="Nama kamu"
        >

        <input
            id="roomCodeInput"
            class="input"
            maxlength="20"
            placeholder="Kode meeting jika ingin bergabung"
        >

        <div class="home-buttons">

            <button id="createBtn" class="primary">
                Buat Meeting
            </button>

            <button id="joinBtn" class="secondary">
                Gabung Meeting
            </button>

        </div>

        <div id="homeError" class="error"></div>

    </div>

</section>


<section id="lobby" class="hidden">

    <div class="lobby-card">

        <div class="lobby-title">
            Siap bergabung?
        </div>

        <div class="preview">

            <video
                id="lobbyVideo"
                autoplay
                muted
                playsinline
            ></video>

            <div id="lobbyLabel" class="preview-label">
                Kamera
            </div>

        </div>

        <div class="lobby-controls">

            <button id="lobbyMic" class="control active">
                🎤 Mic
            </button>

            <button id="lobbyCamera" class="control active">
                📷 Kamera
            </button>

        </div>

        <button id="joinNowBtn" class="join-btn">
            Masuk ke Meeting
        </button>

        <div id="lobbyError" class="error"></div>

    </div>

</section>


<section id="meeting" class="hidden">

    <header class="topbar">

        <div>
            <div class="brand-small">
                CLASSROOM LIVE
            </div>

            <div id="roomLabel" class="room-code">
                Meeting
            </div>
        </div>

        <div class="top-actions">

            <button id="copyBtn" class="small-btn">
                🔗 Salin
            </button>

            <button id="soundBtn" class="sound-btn">
                🔊 Aktifkan Suara
            </button>

            <button id="peopleBtn" class="small-btn">
                👥 <span id="countLabel">1</span>
            </button>

        </div>

    </header>


    <div class="content">

        <main id="grid" class="grid"></main>

        <aside id="sidebar" class="sidebar">

            <div class="side-head">
                Peserta
            </div>

            <div id="peopleList" class="people-list"></div>

        </aside>

    </div>


    <div id="chat" class="chat">

        <div class="chat-head">
            💬 Chat
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">

            <input
                id="chatInput"
                maxlength="500"
                placeholder="Tulis pesan..."
            >

            <button id="sendChat">
                ➤
            </button>

        </div>

    </div>


    <footer class="bottom">

        <button id="micBtn" class="meet-btn active" title="Microphone">
            🎤
        </button>

        <button id="cameraBtn" class="meet-btn active" title="Kamera">
            📷
        </button>

        <button id="handBtn" class="meet-btn" title="Angkat tangan">
            ✋
        </button>

        <button id="chatBtn" class="meet-btn" title="Chat">
            💬
        </button>

        <button id="backgroundBtn" class="meet-btn" title="Background">
            🖼️
        </button>

        <button
            id="shareBtn"
            class="meet-btn"
            title="Bagikan layar"
        >
            🖥️
        </button>

        <button id="nameBtn" class="meet-btn" title="Ganti nama">
            👤
        </button>

        <button id="leaveBtn" class="meet-btn danger" title="Keluar">
            ☎
        </button>

    </footer>

</section>


<div id="status" class="status"></div>


<div id="nameModal" class="modal">

    <div class="modal-card">

        <div class="modal-title">
            Ganti Nama
        </div>

        <input
            id="newName"
            class="input"
            maxlength="40"
            placeholder="Nama baru"
        >

        <div class="modal-buttons">

            <button id="cancelName" class="secondary">
                Batal
            </button>

            <button id="saveName" class="primary">
                Simpan
            </button>

        </div>

    </div>

</div>


<div id="backgroundModal" class="modal">

    <div class="modal-card">

        <div class="modal-title">
            Background
        </div>

        <div class="background-options">

            <button class="bg-option" data-bg="none">
                🚫 Tanpa Background
            </button>

            <button class="bg-option" data-bg="blue">
                🔵 Biru
            </button>

            <button class="bg-option" data-bg="purple">
                🟣 Ungu
            </button>

            <button class="bg-option" id="uploadBgBtn">
                📁 Upload Foto
            </button>

        </div>

        <input
            id="backgroundFile"
            type="file"
            accept="image/*"
            hidden
        >

        <div id="backgroundError" class="error"></div>

        <button
            id="closeBackground"
            class="secondary"
            style="width:100%;margin-top:15px"
        >
            Tutup
        </button>

    </div>

</div>


<video
    id="processingVideo"
    autoplay
    muted
    playsinline
    style="display:none"
></video>


<script>
"use strict";

/* =========================================================
   SOCKET
========================================================= */

const socket = io({
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000
});


/* =========================================================
   ELEMENTS
========================================================= */

const home = document.getElementById("home");
const lobby = document.getElementById("lobby");
const meeting = document.getElementById("meeting");

const homeName = document.getElementById("homeName");
const roomCodeInput = document.getElementById("roomCodeInput");

const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");
const joinNowBtn = document.getElementById("joinNowBtn");

const lobbyVideo = document.getElementById("lobbyVideo");
const processingVideo = document.getElementById("processingVideo");

const lobbyMic = document.getElementById("lobbyMic");
const lobbyCamera = document.getElementById("lobbyCamera");

const grid = document.getElementById("grid");
const roomLabel = document.getElementById("roomLabel");
const countLabel = document.getElementById("countLabel");

const micBtn = document.getElementById("micBtn");
const cameraBtn = document.getElementById("cameraBtn");
const handBtn = document.getElementById("handBtn");
const chatBtn = document.getElementById("chatBtn");
const backgroundBtn = document.getElementById("backgroundBtn");
const shareBtn = document.getElementById("shareBtn");
const nameBtn = document.getElementById("nameBtn");
const leaveBtn = document.getElementById("leaveBtn");

const sidebar = document.getElementById("sidebar");
const peopleBtn = document.getElementById("peopleBtn");
const peopleList = document.getElementById("peopleList");

const chat = document.getElementById("chat");
const chatInput = document.getElementById("chatInput");
const sendChat = document.getElementById("sendChat");
const chatMessages = document.getElementById("chatMessages");

const soundBtn = document.getElementById("soundBtn");
const copyBtn = document.getElementById("copyBtn");

const nameModal = document.getElementById("nameModal");
const newName = document.getElementById("newName");
const saveName = document.getElementById("saveName");
const cancelName = document.getElementById("cancelName");

const backgroundModal =
    document.getElementById("backgroundModal");

const backgroundFile =
    document.getElementById("backgroundFile");

const uploadBgBtn =
    document.getElementById("uploadBgBtn");

const closeBackground =
    document.getElementById("closeBackground");

const statusBox =
    document.getElementById("status");


/* =========================================================
   STATE
========================================================= */

let localStream = null;

let rawVideoTrack = null;
let localAudioTrack = null;

let processedStream = null;
let processedVideoTrack = null;

let currentRoom = null;
let currentName = "";
let currentRole = "";

let cameraEnabled = true;
let micEnabled = true;
let handRaised = false;

let joined = false;


/*
 * SCREEN SHARE
 */

let screenStream = null;
let screenTrack = null;
let sharingScreen = false;


const peers = new Map();
const pendingIce = new Map();
const remoteStreams = new Map();
const participantData = new Map();


/* =========================================================
   BACKGROUND PROCESSING
========================================================= */

let segmentation = null;

let backgroundEnabled = false;
let selectedBackground = null;
let customBackgroundImage = null;

let backgroundRunning = false;

const outputCanvas =
    document.createElement("canvas");

const foregroundCanvas =
    document.createElement("canvas");

const backgroundCanvas =
    document.createElement("canvas");

const outputCtx =
    outputCanvas.getContext("2d");

const foregroundCtx =
    foregroundCanvas.getContext("2d");

const backgroundCtx =
    backgroundCanvas.getContext("2d");


/* =========================================================
   HELPERS
========================================================= */

function showStatus(text, duration = 2500){

    statusBox.textContent = text;
    statusBox.classList.add("show");

    clearTimeout(showStatus.timer);

    showStatus.timer = setTimeout(() => {
        statusBox.classList.remove("show");
    }, duration);
}


function showHomeError(text){
    document.getElementById("homeError").textContent = text;
}


function showLobbyError(text){
    document.getElementById("lobbyError").textContent = text;
}


function makeAvatar(name){

    const letter =
        String(name || "?")
            .trim()
            .charAt(0)
            .toUpperCase();

    return letter || "?";
}


function escapeText(value){
    return String(value ?? "");
}


/*
 * PRIORITAS:
 *
 * 1. Screen share
 * 2. Background
 * 3. Kamera asli
 */

function getDisplayStream(){

    if (
        sharingScreen &&
        screenStream
    ){
        return screenStream;
    }

    if (
        backgroundEnabled &&
        processedStream &&
        processedVideoTrack
    ){
        return processedStream;
    }

    if (localStream){
        return localStream;
    }

    return null;
}


/* =========================================================
   MEDIA
========================================================= */

async function getLocalMedia(){

    if (localStream) return localStream;

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){
        throw new Error(
            "Browser tidak mendukung kamera dan microphone."
        );
    }


    try{

        localStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    },

                    facingMode: "user"
                },

                audio: {
                    echoCancellation: {
                        ideal: true
                    },

                    noiseSuppression: {
                        ideal: true
                    },

                    autoGainControl: {
                        ideal: true
                    },

                    channelCount: {
                        ideal: 1
                    },

                    sampleRate: {
                        ideal: 48000
                    },

                    sampleSize: {
                        ideal: 16
                    },

                    latency: {
                        ideal: 0.02
                    }
                }

            });

    }catch(error){

        console.error(
            "getUserMedia error:",
            error
        );

        throw new Error(
            "Kamera atau microphone tidak dapat digunakan. Pastikan izin kamera dan microphone diberikan."
        );
    }


    rawVideoTrack =
        localStream.getVideoTracks()[0] || null;

    localAudioTrack =
        localStream.getAudioTracks()[0] || null;


    cameraEnabled =
        !!rawVideoTrack;

    micEnabled =
        !!localAudioTrack;


    if (rawVideoTrack){
        rawVideoTrack.enabled =
            cameraEnabled;
    }


    if (localAudioTrack){

        localAudioTrack.enabled =
            micEnabled;

        try{

            await localAudioTrack.applyConstraints({

                echoCancellation: {
                    ideal: true
                },

                noiseSuppression: {
                    ideal: true
                },

                autoGainControl: {
                    ideal: true
                },

                channelCount: {
                    ideal: 1
                }

            });

        }catch(error){

            console.warn(
                "Audio constraints tambahan tidak tersedia:",
                error
            );
        }
    }


    processingVideo.srcObject =
        new MediaStream(
            rawVideoTrack
                ? [rawVideoTrack]
                : []
        );

    await processingVideo.play().catch(() => {});


    lobbyVideo.srcObject =
        localStream;

    lobbyVideo.muted = true;
    lobbyVideo.defaultMuted = true;

/* =========================================================
   PEER CONNECTION
========================================================= */

function createPeer(
    peerId,
    peerName = "Peserta",
    shouldOffer = false
){

    if (!peerId) return null;

    if (peerId === socket.id){
        return null;
    }


    if (peers.has(peerId)){

        const old =
            peers.get(peerId);

        if (
            old &&
            old.connectionState !==
            "closed"
        ){

            return old;
        }
    }


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls: [
                        "stun:stun.l.google.com:19302",
                        "stun:stun1.l.google.com:19302"
                    ]
                }

            ],

            bundlePolicy:
                "max-bundle",

            rtcpMuxPolicy:
                "require"

        });


    peers.set(
        peerId,
        pc
    );

    pendingIce.set(
        peerId,
        []
    );

    remoteStreams.set(
        peerId,
        new MediaStream()
    );


    participantData.set(
        peerId,
        {
            id: peerId,
            name: peerName,
            role: "student",
            camera: true,
            mic: true,
            hand: false
        }
    );


    /*
     * LOCAL VIDEO
     */

    const display =
        getDisplayStream();


    if (display){

        for (
            const track
            of display.getVideoTracks()
        ){

            try{

                pc.addTrack(
                    track,
                    display
                );

            }catch(error){

                console.warn(
                    "Video addTrack error:",
                    error
                );
            }
        }
    }


    /*
     * LOCAL AUDIO
     *
     * Selalu dari microphone asli.
     */

    if (localAudioTrack){

        try{

            pc.addTrack(
                localAudioTrack,
                localStream
            );

        }catch(error){

            console.warn(
                "Audio addTrack error:",
                error
            );
        }
    }


    /*
     * ICE
     */

    pc.onicecandidate =
        event => {

            if (!event.candidate){
                return;
            }


            socket.emit(
                "ice-candidate",
                {
                    to: peerId,
                    candidate:
                        event.candidate
                }
            );
        };


    /*
     * REMOTE TRACK
     */

    pc.ontrack =
        event => {

            let stream =
                remoteStreams.get(
                    peerId
                );


            if (!stream){

                stream =
                    new MediaStream();

                remoteStreams.set(
                    peerId,
                    stream
                );
            }


            if (
                !stream.getTracks()
                    .some(
                        track =>
                            track.id ===
                            event.track.id
                    )
            ){

                stream.addTrack(
                    event.track
                );
            }


            createOrUpdateRemoteTile(
                peerId,
                stream
            );
        };


    /*
     * CONNECTION STATE
     */

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            console.log(
                "Peer",
                peerId,
                "connection:",
                state
            );


            if (
                state ===
                "connected"
            ){

                showStatus(
                    `Terhubung dengan ${getPeerName(peerId)}`
                );
            }


            if (
                state === "failed"
            ){

                setTimeout(
                    () => {

                        if (
                            pc.connectionState ===
                            "failed"
                        ){

                            rebuildPeer(
                                peerId
                            );
                        }

                    },
                    3000
                );
            }


            if (
                state === "closed"
            ){

                removePeer(
                    peerId
                );
            }
        };


    /*
     * ICE CONNECTION
     */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "Peer",
                peerId,
                "ICE:",
                pc.iceConnectionState
            );
        };


    /*
     * OFFER
     */

    if (shouldOffer){

        makeOffer(
            peerId,
            pc
        );
    }


    return pc;
}


/* =========================================================
   OFFER
========================================================= */

async function makeOffer(
    peerId,
    pc
){

    try{

        const offer =
            await pc.createOffer({

                offerToReceiveAudio:
                    true,

                offerToReceiveVideo:
                    true

            });


        await pc.setLocalDescription(
            offer
        );


        socket.emit(
            "offer",
            {
                to: peerId,
                offer:
                    pc.localDescription
            }
        );

    }catch(error){

        console.error(
            "Offer error:",
            error
        );
    }
}


/* =========================================================
   OFFER RECEIVED
========================================================= */

socket.on(
    "offer",
    async data => {

        if (
            !data?.from ||
            !data?.offer
        ){
            return;
        }


        const peerId =
            data.from;


        let pc =
            peers.get(
                peerId
            );


        if (!pc){

            pc =
                createPeer(
                    peerId,
                    "Peserta",
                    false
                );
        }


        try{

            await pc.setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


            await flushPendingIce(
                peerId,
                pc
            );


            const answer =
                await pc.createAnswer();


            await pc.setLocalDescription(
                answer
            );


            socket.emit(
                "answer",
                {
                    to: peerId,
                    answer:
                        pc.localDescription
                }
            );

        }catch(error){

            console.error(
                "Answer error:",
                error
            );
        }
    }
);


/* =========================================================
   ANSWER
========================================================= */

socket.on(
    "answer",
    async data => {

        if (
            !data?.from ||
            !data?.answer
        ){
            return;
        }


        const pc =
            peers.get(
                data.from
            );


        if (!pc) return;


        try{

            await pc.setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


            await flushPendingIce(
                data.from,
                pc
            );

        }catch(error){

            console.error(
                "Set answer error:",
                error
            );
        }
    }
);


/* =========================================================
   ICE
========================================================= */

socket.on(
    "ice-candidate",
    async data => {

        if (
            !data?.from ||
            !data?.candidate
        ){
            return;
        }


        const peerId =
            data.from;


        const pc =
            peers.get(
                peerId
            );


        if (!pc){

            const list =
                pendingIce.get(
                    peerId
                ) || [];


            list.push(
                data.candidate
            );


            pendingIce.set(
                peerId,
                list
            );


            return;
        }


        try{

            if (
                !pc.remoteDescription ||
                !pc.remoteDescription.type
            ){

                const list =
                    pendingIce.get(
                        peerId
                    ) || [];


                list.push(
                    data.candidate
                );


                pendingIce.set(
                    peerId,
                    list
                );


                return;
            }


            await pc.addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

        }catch(error){

            console.warn(
                "ICE candidate error:",
                error
            );
        }
    }
);


async function flushPendingIce(
    peerId,
    pc
){

    const list =
        pendingIce.get(
            peerId
        ) || [];


    if (
        !pc.remoteDescription ||
        !pc.remoteDescription.type
    ){
        return;
    }


    pendingIce.set(
        peerId,
        []
    );


    for (
        const candidate
        of list
    ){

        try{

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.warn(
                "Queued ICE error:",
                error
            );
        }
    }
}

async function rebuildPeer(
    peerId
){

    const old =
        peers.get(
            peerId
        );


    if (old){

        try{
            old.close();
        }catch(_){}
    }


    peers.delete(
        peerId
    );


    const user =
        participantData.get(
            peerId
        );


    if (
        currentRole ===
        "student"
    ){

        createPeer(
            peerId,
            user?.name || "Peserta",
            true
        );

    }else{

        createPeer(
            peerId,
            user?.name || "Peserta",
            false
        );
    }
}

        avatar.className =
            "avatar";


        const name =
            document.createElement("div");

        name.className =
            "name";


        const state =
            document.createElement("div");

        state.className =
            "state";

        );

    const avatar =

        );

        tile.querySelector(

        );


    if (user){

        name.textContent =

                user.role === "teacher"
                    ? "• Guru"
                    : ""
            }`;


        avatar.textContent =
            makeAvatar(
                user.name
            );


        avatar.style.display =
            user.camera
                ? "none"
                : "flex";
    }


    if (
        video.srcObject !== stream
    ){

        video.srcObject =
            stream;
    }


    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;

    video.style.transform =
        "none";


    video.play().catch(
        error => {

            console.warn(
                "Remote autoplay blocked:",
                error
            );

            soundBtn.classList.add(
                "active"
            );
        }
    );


    for (
        const track
        of stream.getTracks()
    ){

        track.onended =
            () => {

                if (
                    video.srcObject ===
                    stream
                ){

                    video.play().catch(
                        () => {}
                    );
                }
            };
    }
}

/*
 * SERVER ADALAH SUMBER KEBENARAN
 */

socket.on(
    "media-state",
    data => {

        if (!data?.id) return;


        const user =
            participantData.get(
                data.id
            );


        if (user){

            user.camera =
                data.camera !== false;

            user.mic =
                data.mic === true;
        }


        /*
         * Jika ini adalah diri sendiri,
         * gunakan keputusan server.
         */

        if (
            data.id === socket.id
        ){

            cameraEnabled =
                data.camera !== false;

            micEnabled =
                data.mic === true;


            if (localAudioTrack){

                localAudioTrack.enabled =
                    micEnabled;
            }


            if (rawVideoTrack){

                rawVideoTrack.enabled =
                    cameraEnabled;
            }


            updateLocalButtons();

/* =========================================================
   SCREEN SHARE
========================================================= */

async function startScreenShare(){

    if (!joined){

        showStatus(
            "Kamu belum berada di meeting."
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        showStatus(
            "Browser ini tidak mendukung screen sharing."
        );

        return;
    }


    if (sharingScreen){
        return;
    }


    try{

        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: {
                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                },

                /*
                 * Tidak mengambil audio sistem.
                 * Ini sengaja agar tidak menambah
                 * risiko echo/dengung.
                 */

                audio: false
            });


        screenTrack =
            screenStream.getVideoTracks()[0];


        if (!screenTrack){

            throw new Error(
                "Track layar tidak tersedia."
            );
        }


        sharingScreen = true;


        /*
         * Ganti video yang dikirim ke
         * semua peserta.
         */

        await replaceOutgoingVideoTrack(
            screenTrack
        );


        /*
         * Preview lokal.
         */

        const localVideo =
            document.querySelector(
                `#tile-${socket.id} video`
            );


        if (localVideo){

            localVideo.srcObject =
                screenStream;

            localVideo.muted = true;
            localVideo.defaultMuted = true;
            localVideo.volume = 0;

            localVideo.style.transform =
                "none";

            localVideo.play().catch(
                () => {}
            );
        }


        shareBtn.classList.add(
            "active"
        );

        shareBtn.textContent =
            "🛑";

        shareBtn.title =
            "Berhenti berbagi layar";


        showStatus(
            "Berbagi layar aktif."
        );


        /*
         * Jika user menekan tombol
         * "Stop sharing" bawaan browser,
         * otomatis kembali ke kamera.
         */

        screenTrack.onended =
            () => {

                if (sharingScreen){

                    stopScreenShare();
                }
            };

    }catch(error){

        console.error(
            "Screen share error:",
            error
        );


        if (screenStream){

            for (
                const track
                of screenStream.getTracks()
            ){

                try{
                    track.stop();
                }catch(_){}
            }
        }


        screenStream = null;
        screenTrack = null;
        sharingScreen = false;


        shareBtn.classList.remove(
            "active"
        );

        shareBtn.textContent =
            "🖥️";

        shareBtn.title =
            "Bagikan layar";


        showStatus(
            "Berbagi layar dibatalkan."
        );
    }
}


async function stopScreenShare(){

    if (!sharingScreen){
        return;
    }


    sharingScreen = false;


    if (screenTrack){

        try{
            screenTrack.onended = null;
        }catch(_){}


        try{
            screenTrack.stop();
        }catch(_){}


        screenTrack = null;
    }


    if (screenStream){

        for (
            const track
            of screenStream.getTracks()
        ){

            try{
                track.stop();
            }catch(_){}
        }


        screenStream = null;
    }


    /*
     * Kembali ke background atau kamera.
     */

    const returnTrack =
        backgroundEnabled &&
        processedVideoTrack
            ? processedVideoTrack
            : rawVideoTrack;


    if (returnTrack){

        await replaceOutgoingVideoTrack(
            returnTrack
        );
    }


    const localVideo =
        document.querySelector(
            `#tile-${socket.id} video`
        );


    if (localVideo){

        const display =
            getDisplayStream();


        if (display){

            localVideo.srcObject =
                display;
        }


        localVideo.muted = true;
        localVideo.defaultMuted = true;
        localVideo.volume = 0;

        localVideo.style.transform =
            "none";

        localVideo.play().catch(
            () => {}
        );
    }


    shareBtn.classList.remove(
        "active"
    );

    shareBtn.textContent =
        "🖥️";

    shareBtn.title =
        "Bagikan layar";


    showStatus(
        "Berbagi layar dihentikan."
    );
}

    }
);

/* =========================================================
   MEDIAPIPE
========================================================= */

function initSegmentation(){

    if (segmentation) return;


    if (
        typeof SelfieSegmentation ===
        "undefined"
    ){

        console.warn(
            "MediaPipe SelfieSegmentation belum tersedia."
        );

        return;
    }


    segmentation =
        new SelfieSegmentation({

            locateFile:
                file => {

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/" +
                        file
                    );
                }

        });


    segmentation.setOptions({

        modelSelection: 1,

        selfieMode: false

    });


    segmentation.onResults(
        handleSegmentationResults
    );
}


/* =========================================================
   ENABLE BACKGROUND
========================================================= */

async function enableBackground(){

    if (!rawVideoTrack){

        showStatus(
            "Kamera belum tersedia."
        );

        return;
    }


    /*
     * Screen share harus dihentikan
     * sebelum background digunakan.
     */

    if (sharingScreen){

        await stopScreenShare();
    }


    initSegmentation();


    if (!segmentation){

        showStatus(
            "Background belum siap."
        );

        return;
    }


    backgroundEnabled =
        true;


    await processingVideo.play().catch(
        () => {}
    );


    if (!backgroundRunning){

        backgroundRunning =
            true;

        processBackgroundFrame();
    }


    showStatus(
        "Background aktif."
    );
}


/* =========================================================
   BACKGROUND LOOP
========================================================= */

async function processBackgroundFrame(){

    if (!backgroundEnabled){

        backgroundRunning =
            false;

        return;
    }


    if (
        processingVideo.readyState >=
        2
    ){

        try{

            await segmentation.send({
                image:
                    processingVideo
            });

        }catch(error){

            console.warn(
                "Segmentation error:",
                error
            );
        }
    }


    requestAnimationFrame(
        processBackgroundFrame
    );
}


/* =========================================================
   BACKGROUND RESULTS
========================================================= */

function handleSegmentationResults(
    results
){

    if (!backgroundEnabled){
        return;
    }


    /*
     * JANGAN mengganti screen-share
     * dengan hasil MediaPipe.
     */

    if (sharingScreen){
        return;
    }


    const width =
        results.image?.videoWidth ||
        processingVideo.videoWidth ||
        1280;


    const height =
        results.image?.videoHeight ||
        processingVideo.videoHeight ||
        720;


    if (
        !width ||
        !height
    ){
        return;
    }


    if (
        outputCanvas.width !== width ||
        outputCanvas.height !== height
    ){

        outputCanvas.width =
            width;

        outputCanvas.height =
            height;

        foregroundCanvas.width =
            width;

        foregroundCanvas.height =
            height;

        backgroundCanvas.width =
            width;

        backgroundCanvas.height =
            height;
    }


    /*
     * BACKGROUND
     */

    backgroundCtx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        customBackgroundImage
    ){

        drawCover(
            backgroundCtx,
            customBackgroundImage,
            width,
            height
        );

    }else if (
        selectedBackground ===
        "purple"
    ){

        backgroundCtx.fillStyle =
            "#35205f";

        backgroundCtx.fillRect(
            0,
            0,
            width,
            height
        );

    }else{

        backgroundCtx.fillStyle =
            "#163d72";

        backgroundCtx.fillRect(
            0,
            0,
            width,
            height
        );
    }


    /*
     * FOREGROUND
     */

    foregroundCtx.clearRect(
        0,
        0,
        width,
        height
    );


    foregroundCtx.globalCompositeOperation =
        "source-over";


    foregroundCtx.drawImage(
        results.image,
        0,
        0,
        width,
        height
    );


    foregroundCtx.globalCompositeOperation =
        "destination-in";


    foregroundCtx.drawImage(
        results.segmentationMask,
        0,
        0,
        width,
        height
    );


    /*
     * OUTPUT
     */

    outputCtx.clearRect(
        0,
        0,
        width,
        height
    );


    outputCtx.globalCompositeOperation =
        "source-over";


    outputCtx.drawImage(
        backgroundCanvas,
        0,
        0,
        width,
        height
    );


    outputCtx.drawImage(
        foregroundCanvas,
        0,
        0,
        width,
        height
    );


    /*
     * STREAM
     */

    if (!processedStream){

        processedStream =
            outputCanvas.captureStream(
                30
            );


        processedVideoTrack =
            processedStream.getVideoTracks()[0];


        /*
         * Microphone asli.
         */

        if (localAudioTrack){

            processedStream.addTrack(
                localAudioTrack
            );
        }
    }


    /*
     * LOCAL PREVIEW
     */

    const localVideo =
        document.querySelector(
            `#tile-${socket.id} video`
        );


    if (localVideo){

        localVideo.srcObject =
            processedStream;

        localVideo.muted =
            true;

        localVideo.defaultMuted =
            true;

        localVideo.volume =
            0;

        localVideo.style.transform =
            "none";

        localVideo.play().catch(
            () => {}
        );
    }


    /*
     * GANTI TRACK VIDEO REMOTE
     */

    replaceOutgoingVideoTrack(
        processedVideoTrack
    );
}


/* =========================================================
   COVER IMAGE
========================================================= */

function drawCover(
    ctx,
    image,
    width,
    height
){

    const scale =
        Math.max(
            width / image.width,
            height / image.height
        );


    const w =
        image.width * scale;


    const h =
        image.height * scale;


    const x =
        (width - w) / 2;


    const y =
        (height - h) / 2;


    ctx.drawImage(
        image,
        x,
        y,
        w,
        h
    );
}


/* =========================================================
   REPLACE OUTGOING VIDEO
========================================================= */

async function replaceOutgoingVideoTrack(
    track
){

    if (!track) return;


    for (
        const [
            peerId,
            pc
        ]
        of peers
    ){

        if (
            pc.connectionState ===
            "closed"
        ){
            continue;
        }


        const sender =
            pc.getSenders()
                .find(
                    s =>
                        s.track &&
                        s.track.kind ===
                        "video"
                );


        if (!sender) continue;


        try{

            await sender.replaceTrack(
                track
            );

        }catch(error){

            console.warn(
                "replaceTrack error:",
                peerId,
                error
            );
        }
    }
}

        for (
            const track

            );


        if (

            localStream
        ){

            localVideo.srcObject =

            localVideo.defaultMuted =
                true;

            localVideo.volume =
                0;

            localVideo.style.transform =

            localVideo.play().catch(

            );

    );
}

function leaveMeeting(){

    if (!joined){
        return;
    }


    joined = false;


    /*
     * Stop screen sharing.
     */

    if (screenTrack){

        try{
            screenTrack.onended = null;
        }catch(_){}


        try{
            screenTrack.stop();
        }catch(_){}

        screenTrack = null;
    }


    if (screenStream){

        for (
            const track
            of screenStream.getTracks()
        ){

            try{
                track.stop();
            }catch(_){}
        }

        screenStream = null;
    }


    sharingScreen = false;


    shareBtn.classList.remove(
        "active"
    );

    shareBtn.textContent =
        "🖥️";

    shareBtn.title =
        "Bagikan layar";


    /*
     * Inform server.
     */

    socket.emit(
        "leave-room"
    );


    /*
     * Tutup peer.
     */

    for (
        const pc
        of peers.values()
    ){

        try{
            pc.close();
        }catch(_){}
    }


    peers.clear();
    pendingIce.clear();
    remoteStreams.clear();
    participantData.clear();


    /*
     * Stop camera + microphone.
     */

    if (localStream){

        for (
            const track
            of localStream.getTracks()
        ){

            try{
                track.stop();
            }catch(_){}
        }
    }


    localStream =
        null;


    rawVideoTrack =
        null;


    localAudioTrack =
        null;


    /*
     * Stop processed stream.
     */

    if (processedStream){

        for (
            const track
            of processedStream.getTracks()
        ){

            try{
                track.stop();
            }catch(_){}
        }
    }


    processedStream =
        null;

    processedVideoTrack =
        null;


    /*
     * Reset state.
     */

    backgroundEnabled =
        false;

    selectedBackground =
        null;

    customBackgroundImage =
        null;

    backgroundRunning =
        false;

    cameraEnabled =

    "disconnect",
    reason => {

        console.warn(
            "Socket disconnected:",
            reason
        );


        if (joined){

            showStatus(
                "Koneksi server terputus. Mencoba menyambungkan kembali...",
                5000
            );
        }
    }
);


/* =========================================================
   URL AUTO JOIN
========================================================= */

(function autoJoinFromUrl(){

    const match =
        location.pathname.match(
            /^\/meeting\/([^/]+)/
        );


    if (!match) return;


    const code =
        decodeURIComponent(
            match[1]
        ).toUpperCase();


    roomCodeInput.value =
        code;


    homeName.focus();
})();


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (joined){

            socket.emit(
                "leave-room"
            );
        }
    }
);


console.log(
    "CLASSROOM LIVE client loaded."
);
</script>
