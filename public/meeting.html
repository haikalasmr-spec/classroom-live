<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting • Classroom Live</title><link rel="stylesheet" href="/style.css"></head>
<body class="meeting-body">
  <div id="toast" class="toast" role="status"></div>
  <header class="meeting-top">
    <div><div class="brand small">CLASSROOM <span>LIVE</span></div><div class="room-meta">Room <strong id="roomCode">—</strong> · <span id="connectionLabel">Connecting…</span></div></div>
    <div class="top-actions"><button class="ghost" id="copyRoom">Copy code</button><button class="ghost" id="copyLink">Invite</button><button class="danger" id="leaveTop">Leave</button></div>
  </header>

  <main class="meeting-layout">
    <section class="stage">
      <div id="grid" class="video-grid"></div>
      <div id="lobby" class="lobby-overlay hidden">
        <div class="lobby-card"><p class="eyebrow">READY TO JOIN</p><h2>Check your setup</h2><div class="lobby-preview"><video id="localPreview" autoplay playsinline muted></video><div id="previewFallback" class="avatar big hidden">A</div></div><div class="device-status"><span id="micStatus">Microphone: checking…</span><span id="camStatus">Camera: checking…</span></div><div class="lobby-actions"><button id="lobbyMic" class="control">🎤 Mic</button><button id="lobbyCam" class="control">📷 Camera</button><button id="testSpeaker" class="control">🔊 Test Speaker</button></div><button id="joinNow" class="primary">Join Meeting <span>→</span></button><p class="tiny" id="lobbyError"></p></div>
      </div>
    </section>
    <aside class="sidebar" id="sidebar">
      <div class="side-head"><h3 id="sideTitle">Participants</h3><span id="countBadge">0</span></div>
      <div id="participantList" class="participant-list"></div>
      <div class="chat-panel"><div class="chat-head"><h3>Chat</h3><span id="unread" class="unread hidden">0</span></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="500" placeholder="Message everyone…" autocomplete="off"><button aria-label="Send message">➤</button></form></div>
    </aside>
  </main>

  <footer class="control-bar">
    <button id="toggleMic" class="control" aria-label="Toggle microphone">🎤 <span>Mic</span></button>
    <button id="toggleCam" class="control" aria-label="Toggle camera">📷 <span>Camera</span></button>
    <button id="shareScreen" class="control" aria-label="Share screen">▣ <span>Share</span></button>
    <button id="raiseHand" class="control" aria-label="Raise hand">✋ <span>Raise</span></button>
    <button id="toggleChat" class="control" aria-label="Toggle chat">💬 <span>Chat</span></button>
    <button id="togglePeople" class="control" aria-label="Toggle participants">👥 <span>People</span></button>
    <button id="moreBtn" class="control" aria-expanded="false">⋯ <span>More</span></button>
    <button id="leaveBtn" class="control danger" aria-label="Leave meeting">⏻ <span>Leave</span></button>
    <div id="moreMenu" class="more-menu hidden"><button id="audioOnly">Audio only</button><button id="fullscreen">Fullscreen</button><button id="pip">Picture in Picture</button><button id="restartMedia">Restart camera & mic</button><button id="deviceSettings">Device settings</button><button id="connectionInfo">Connection info</button><button id="lockBtn" class="host-only hidden">Lock meeting</button><button id="endBtn" class="host-only hidden danger-text">End meeting</button></div>
  </footer>
  <div id="settingsModal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="closeSettings">×</button><h2>Device settings</h2><label>Microphone<select id="micSelect"></select></label><label>Camera<select id="camSelect"></select></label><button id="applyDevices" class="primary">Apply devices</button><div id="connectionDetails" class="details"></div></div></div>
  <script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
